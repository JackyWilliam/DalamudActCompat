name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0.1"
        required: true
        default: "v0.1.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify bundled dependency versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/sync-parser-dependencies.ps1 -Check
          ./tools/sync-bundled-act-plugins.ps1 -Check
          ./tools/sync-cactbot.ps1 -Check

      - name: Restore
        run: dotnet restore DalamudActCompat.slnx

      - name: Build
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:APPDATA "XIVLauncherCN/addon/Hooks/dev"),
            (Join-Path $env:APPDATA "XIVLauncher/addon/Hooks/dev")
          )
          $dalamud = $candidates |
            Where-Object { Test-Path (Join-Path $_ "Dalamud.dll") } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($dalamud)) {
            throw "Dalamud development files were not found."
          }
          $dalamud = $dalamud.TrimEnd("\", "/") + [IO.Path]::DirectorySeparatorChar
          dotnet build src/DalamudActCompat/DalamudActCompat.csproj `
            --configuration Release `
            --no-restore `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            "-p:DalamudLibPath=$dalamud"

      - name: Collect plugin artifact
        shell: pwsh
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          $version = $env:TAG_NAME.TrimStart("v")
          $parts = $version.Split(".")
          if ($parts.Count -notin 3, 4 -or
              $parts.Where({ $_ -notmatch '^\d+$' }).Count -ne 0) {
            throw "Release version must contain three or four numeric parts: $version"
          }
          $assemblyVersion = if ($parts.Count -eq 3) { "$version.0" } else { $version }
          ./tools/collect-release.ps1 `
            -Configuration Release `
            -OutputDirectory artifacts/release `
            -ExpectedAssemblyVersion $assemblyVersion

      - name: Upload verified resource packs before core
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          $resourcePacks = @(
            Get-ChildItem artifacts/release -File |
              Where-Object { $_.Name -match '^(host-[0-9a-f]{64}|cactbot-.+|act-plugins-.+)\.zip$' } |
              Sort-Object Name |
              ForEach-Object FullName
          )
          if ($resourcePacks.Count -ne 3) {
            throw "Expected exactly three verified resource packs, found $($resourcePacks.Count)."
          }
          gh release create $env:TAG_NAME @resourcePacks `
            --title $env:TAG_NAME `
            --generate-notes `
            --draft
          gh release upload $env:TAG_NAME `
            artifacts/release/resource-packs.json `
            artifacts/release/DalamudActCompat-core.zip
          gh release edit $env:TAG_NAME --draft=false
