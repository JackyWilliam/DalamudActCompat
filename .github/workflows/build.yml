name: Build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      # SDK 15 targets the public staging API. Release packaging still uses the
      # self-hosted CN launcher environment to verify the exact deployment DLLs.
      DALAMUD_ARCHIVE_URL: https://goatcorp.github.io/dalamud-distrib/stg/latest.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud reference assemblies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          $dalamud = Join-Path $env:RUNNER_TEMP "dalamud"
          Invoke-WebRequest -Uri $env:DALAMUD_ARCHIVE_URL -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamud -Force
          if (-not (Test-Path (Join-Path $dalamud "Dalamud.dll"))) {
            throw "Dalamud reference archive did not contain Dalamud.dll."
          }
          "DALAMUD_HOME=$dalamud" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        shell: pwsh
        run: |
          $dalamud = $env:DALAMUD_HOME.TrimEnd("\", "/") + [IO.Path]::DirectorySeparatorChar
          dotnet restore DalamudActCompat.slnx "-p:DalamudLibPath=$dalamud"

      - name: Build full solution
        shell: pwsh
        run: |
          $dalamud = $env:DALAMUD_HOME.TrimEnd("\", "/") + [IO.Path]::DirectorySeparatorChar
          dotnet build DalamudActCompat.slnx `
            --configuration Release `
            --no-restore `
            "-p:DalamudLibPath=$dalamud"

      - name: Run scanner resource smoke
        shell: pwsh
        run: |
          & "tests/DalamudActCompat.ScannerSmokeTests/bin/Release/net10.0-windows/DalamudActCompat.ScannerSmokeTests.exe"

      - name: Download pinned Simulant fixture
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP "simulant-fixture"
          New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null
          $fixture = Join-Path $fixtureDirectory "Simulant.dll"
          Invoke-WebRequest -Uri "https://github.com/MnFeN/Simulant/releases/download/v0.0.4.2/Simulant.dll" -OutFile $fixture
          if ((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne "12F31A446D6F137A7D0B39939F9E0361240D9209AC3677624FF95431C2578467") {
            throw "Simulant fixture hash mismatch."
          }
          "ACTCOMPAT_SIMULANT_DLL=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Release Package smoke
        shell: pwsh
        run: |
          & "tests/DalamudActCompat.PackageSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.PackageSmokeTests.exe"

      - name: Run Host smoke
        shell: pwsh
        run: |
          & "tests/DalamudActCompat.HostSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.HostSmokeTests.exe" `
            "tests/DalamudActCompat.HostSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.Host.exe" `
            "vendor/BundledActPlugins/triggernometry/Triggernometry.dll"

      - name: Run original Simulant compatibility smoke
        shell: pwsh
        run: |
          & "tests/DalamudActCompat.HostSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.HostSmokeTests.exe" `
            --simulant "$env:ACTCOMPAT_SIMULANT_DLL" "vendor/BundledActPlugins"

      - name: Run U7b initialization ordering regression
        shell: pwsh
        run: |
          & "tests/DalamudActCompat.HostSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.HostSmokeTests.exe" `
            --probe-triggernometry-u7b-ordering `
            "tests/DalamudActCompat.HostSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.Host.exe" `
            "vendor/BundledActPlugins" (Join-Path $env:RUNNER_TEMP "u7b-ordering-smoke")
          if ($LASTEXITCODE -ne 0) { throw "U7b initialization ordering regression." }

      - name: Run encounter drawing diagnostics regression
        shell: pwsh
        run: |
          & "tests/DalamudActCompat.HostSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.HostSmokeTests.exe" `
            --probe-drawing-diagnostics `
            "tests/DalamudActCompat.HostSmokeTests/bin/Release/net10.0-windows10.0.17763.0/DalamudActCompat.Host.exe" `
            "vendor/BundledActPlugins" (Join-Path $env:RUNNER_TEMP "drawing-diagnostics-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Encounter drawing diagnostics regression." }

      - name: Run Legacy Resource smoke
        shell: pwsh
        run: |
          & "tests/DalamudActCompat.LegacyResourceSmokeTests/bin/Release/net10.0-windows/DalamudActCompat.LegacyResourceSmokeTests.exe" `
            "vendor/BundledActPlugins/triggernometry/Triggernometry.dll" `
            "vendor/BundledActPlugins/postnamazu/PostNamazu.dll"

      - name: Validate custom repository JSON
        shell: pwsh
        run: |
          Get-Content repo/pluginmaster.json -Raw | ConvertFrom-Json | Out-Null
          Write-Host "Plugin metadata is valid JSON."

      - name: Explain release environment requirement
        run: |
          echo "Hosted CI compiles the full plugin against the public SDK 15 staging references and runs all offline smoke suites."
          echo "The release workflow remains self-hosted for CN launcher reference verification, dependency synchronization, packaging, and publication."
